services:
  - type: web
    name: telegram-channel-poster
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # sync: false → values are entered in the Render dashboard, never stored in the repo
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
